[package]
name = "fonte-client-auth-store"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.12.7", default-features = false, features = ["napi9"] }
napi-derive = "=3.6.3"

[build-dependencies]
napi-build = "=2.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"
security-framework-sys = "=2.17.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.1.0", path = "vendor/secret-service-5.1.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
